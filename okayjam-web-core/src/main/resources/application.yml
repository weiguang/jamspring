server:
  port: 8080
  shutdown: graceful

spring:
  # Enable virtual thread
  threads:
    virtual:
      enabled: true
  profiles:
    active: @package.environment@
  application:
    name: jamWeb
  jackson:
    date-format: ${app.date-format}
    time-zone: ${app.timezone}
    deserialization:
      fail-on-unknown-properties: false
  devtools:
    restart:
      enabled: true
      poll-interval: 1000
      quiet-period: 400
    livereload:
      enabled: true

  datasource:
    hikari:
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
      # Connection timeout (default 30 seconds)
      connection-timeout: 30000
      # Idle connection timeout (10 minutes), idle connections exceeding this time will be released
      idle-timeout: 600000
      # Connection keep-alive time, set slightly shorter than max-lifetime, recommended 90% of max-lifetime
      # Connection pool warm-up configuration
      initialization-fail-timeout: 0
      # Connection validation optimization
      connection-test-query: SELECT 1

    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://9.135.xx.xx:3306/rms_controller?useUnicode=true&characterEncoding=UTF-8&useSSL=false&characterSetResults=UTF-8
    username: jam
    password:

#    driver-class-name: org.sqlite.JDBC
#    url: jdbc:sqlite:/root/idea_remote_code/jamspring/jam.db
#    username:
#    password:


mybatis:
  type-aliases-package: com.okayjam.web.entity
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
  # Enable virtual thread support
  autoRuntimeDialect: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

http:
  client:
    connect-timeout: 30
    read-timeout: 60
    max-per-route: 50
    max-total: 200

# Application timezone configuration
app:
  timezone: Asia/Shanghai  # Options: UTC, Asia/Shanghai, America/New_York, etc.
  date-format: yyyy-MM-dd HH:mm:ss  # Date format, default: yyyy-MM-dd HH:mm:ss

# Holiday API configuration
holiday:
  api:
    # Holiday API base URL (using timor.tech free API)
    base-url: http://timor.tech/api/holiday